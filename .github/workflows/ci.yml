name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed for release upload on tag push

jobs:
  test:
    name: Test + typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

  appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install FUSE (appimagetool needs it on runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file

      - run: npm ci

      - run: npm run build:appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-patent-x86_64.AppImage
          path: pi-patent-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Attach AppImage to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pi-patent-x86_64.AppImage
          generate_release_notes: true
          draft: false
          prerelease: false
